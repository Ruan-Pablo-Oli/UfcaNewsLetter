services:
  db:
    image: postgres:16-alpine
    container_name: ufcanewsletter-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ufcanewsletter}
      - POSTGRES_USER=${POSTGRES_USER:-ufcanewsletter}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ufcanewsletter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ufcanewsletter} -d $${POSTGRES_DB:-ufcanewsletter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ufcanewsletter:latest
    container_name: ufcanewsletter-web
    # Migrações e seeds idempotentes na subida; o servidor é o gunicorn definido
    # no CMD da imagem (ver Dockerfile).
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py seed_interesses
      && python manage.py seed_fontes_unidades
      && gunicorn ufcanewsletter.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy

  # Agendador das tarefas periódicas (ADR-008): mesma imagem do `web`, processo
  # separado. Fica fora do `web` de propósito — reiniciar a aplicação não
  # derruba o agendamento, e uma segunda réplica do `web` não duplicaria as
  # execuções.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: ufcanewsletter:latest
    container_name: ufcanewsletter-scheduler
    restart: unless-stopped
    command: sh /usr/local/bin/scheduler.sh
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - SCHEDULER_INTERVALO_SEGUNDOS=${SCHEDULER_INTERVALO_SEGUNDOS:-900}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
