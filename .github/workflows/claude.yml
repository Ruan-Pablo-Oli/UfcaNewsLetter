name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the repository owner can trigger Claude, so collaborators cannot spend the owner's tokens.
    if: |
      github.actor == 'Ruan-Pablo-Oli' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # Permite ao agente rodar os comandos de build/test do projeto — Django no
          # backend, Vite/vitest no frontend — para gerar migrações reais e se
          # autovalidar (pytest/ruff/vitest) antes de abrir o PR.
          # Lista aditiva e restrita a ferramentas de dependência/teste — sem Bash geral.
          #
          # `npm` entrou depois da #22 (parte 2): sem ele o agente não consegue rodar
          # `npm ci` nem `npm test`, e entregou 5 testes de frontend quebrados sem
          # ter como perceber. O `pytest` continua não rodando neste sandbox — não há
          # serviço Postgres aqui —, então a validação local antes do merge segue
          # necessária para o backend.
          claude_args: '--allowedTools "Bash(pip install:*),Bash(pip:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(npm:*)"'

